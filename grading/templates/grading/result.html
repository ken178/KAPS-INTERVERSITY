{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Essay Score Result</title>
    <style>
        body {
            font-family: Product Sans, sans-serif;
            background-image: url("{% static 'back.jpg' %}");
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            margin: 0;
            padding: 0;
            color: white;
            text-align: center;
        }

        .overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: -1;
        }

        .container {
            width: 60%;
            margin: 100px auto;
            padding: 30px;
            background: rgba(0, 0, 0, 0.7); /* More solid background */
            border-radius: 15px;
        }

        h1 {
            font-size: 2.5em;
            color:rgb(0, 238, 255);
            font-weight: bold;
        }

        h2 {
            font-size: 2em;
            color:rgb(0, 255, 0);
            font-weight: bold;
            margin-top: 30px;
        }

        p {
            font-size: 1.2em;
            line-height: 1.6;
            text-align: left;
        }

        .explanation-box {
            text-align: left;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .section-title {
            font-size: 1.8em;
            font-weight: bold;
            color:rgb(21, 255, 0);
            margin-top: 30px;
            text-align: left;
        }

        .back-btn {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 24px;
            background-color:rgb(0, 247, 255);
            color: black;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            transition: background 0.3s ease;
            font-size: 1.2em;
        }

        .back-btn:hover {
            background-color: #e6b800;
        }

    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="container">
        <h1>Predicted Score: {{ score }}/10</h1>
        
        <h2>AI Explanation</h2>
        <div class="explanation-box">
            <div class="section-title">Strengths:</div>
            <p>{{ strengths }}</p>

            <div class="section-title">Weaknesses:</div>
            <p>{{ weaknesses }}</p>

            <div class="section-title">Suggested Improvements:</div>
            <p>{{ improvements }}</p>
        </div>
        
        <a href="/" class="back-btn">Go Back</a>
    </div>
</body>
</html>
